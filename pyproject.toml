[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jahids-skills"
version = "0.1.0"
description = "Independent skill library and validator for the JAHIDS.AI platform"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Jahid" }]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
