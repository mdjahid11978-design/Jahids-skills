[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jahids-skills"
version = "0.2.0"
description = "Source distribution of the JAHIDS.AI skill library and validation tooling"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jahid" }]
dependencies = [
  "PyYAML>=6.0.3",
  "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.2.0",
  "build>=1.2",
  "pip-audit>=2.10.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.setuptools]
packages = []
