name: Build and publish release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # actions/setup-python v7.1.0
        with:
          python-version: "3.12"
      - name: Verify release commit is on main
        run: |
          git show-ref --verify --quiet refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Verify tag matches project version
        run: python scripts/check_release_version.py "$GITHUB_REF_NAME"
      - name: Validate skills and generated catalog
        run: |
          python scripts/validate_skills.py
          python scripts/build_catalog.py --check
      - name: Run regression tests
        run: python -m pytest
      - name: Audit dependencies
        run: pip-audit
      - name: Build source distribution
        run: python -m build --sdist
      - name: Upload source distribution
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # actions/upload-artifact v7.0.0
        with:
          name: jahids-skills-sdist
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish approved release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download verified source distribution
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # actions/download-artifact v7.0.0
        with:
          name: jahids-skills-sdist
          path: dist/
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --repo "$GITHUB_REPOSITORY"
