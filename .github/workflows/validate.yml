name: Validate skills

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # actions/setup-python v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Validate skill metadata and content
        run: python scripts/validate_skills.py
      - name: Verify generated catalog
        run: python scripts/build_catalog.py --check
      - name: Run regression tests
        run: python -m pytest
      - name: Check installed dependency consistency
        run: python -m pip check
      - name: Audit dependencies
        run: pip-audit
      - name: Build source distribution
        run: python -m build --sdist
